[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "totomondiale-mcp"
version = "0.1.0"
description = "MCP server for Totomondiale 2026 predictions — allows AI agents to submit bets programmatically"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.27.2",
    "requests>=2.34.2",
]

[project.scripts]
totomondiale-mcp = "server:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]
force-include = { "server.py" = "server.py" }
